<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Agent 演示 · 联网对话</title>
<style>
  :root {
    /* 配色：柔和中性 + 靛蓝主色 */
    --bg: #ffffff;
    --bg-side: #fbfbfc;
    --bg-hover: #f4f4f6;
    --bg-user: #f1f2f6;
    --bg-code: #1c1c22;
    --border: #e8e8ec;
    --border-strong: #d8d8de;
    --text: #16161a;
    --text-2: #52525b;
    --text-dim: #8e8e96;
    --accent: #5145e5;
    --accent-hover: #4338ca;
    --accent-soft: #eef0ff;
    --accent-ring: rgba(81, 69, 229, .12);
    --success: #059669;
    --warn: #d97706;
    --danger: #dc2626;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow-sm: 0 1px 2px rgba(16,16,20,.04), 0 1px 3px rgba(16,16,20,.03);
    --shadow-md: 0 4px 14px rgba(16,16,20,.07), 0 2px 6px rgba(16,16,20,.04);
    --shadow-lg: 0 16px 48px rgba(16,16,20,.14), 0 4px 12px rgba(16,16,20,.06);
    --ease: cubic-bezier(.4, 0, .2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--accent-ring); }

  .layout { display: flex; height: 100vh; overflow: hidden; }

  /* ============ 侧边栏 ============ */
  .sidebar {
    width: 264px;
    background: var(--bg-side);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 14px 12px;
    flex-shrink: 0;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    transition: transform .25s var(--ease);
  }
  .sidebar::-webkit-scrollbar { width: 5px; }
  .sidebar::-webkit-scrollbar-thumb {
    background: #dcdce2; border-radius: 3px;
  }
  .sidebar::-webkit-scrollbar-thumb:hover { background: #c8c8d0; }

  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 8px 18px; font-weight: 650; font-size: 15px;
    letter-spacing: -.01em;
  }
  .brand-dot {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 55%, #a855f7 100%);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; font-weight: 750;
    box-shadow: 0 3px 10px rgba(99,102,241,.32);
    flex-shrink: 0;
  }

  .btn-new {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong); background: #fff;
    cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text);
    transition: all .18s var(--ease); width: 100%; font-family: inherit;
    box-shadow: var(--shadow-sm);
  }
  .btn-new:hover {
    background: #fff; border-color: var(--accent);
    color: var(--accent); box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
  .btn-new:active { transform: translateY(0); }

  /* 侧边栏操作按钮 */
  .side-action {
    display: flex; align-items: center; gap: 9px;
    width: 100%; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: #fff; cursor: pointer; font-family: inherit;
    font-size: 13px; font-weight: 500; color: var(--text-2);
    transition: all .16s var(--ease);
  }
  .side-action:hover {
    border-color: var(--accent); color: var(--accent);
    background: var(--accent-soft);
  }
  .side-badge {
    min-width: 20px; height: 20px; padding: 0 6px;
    border-radius: 10px; background: var(--bg-hover);
    font-size: 11px; font-weight: 600; color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .side-action:hover .side-badge {
    background: var(--accent); color: #fff;
  }
  .side-hint {
    font-size: 11px; color: var(--text-dim);
    padding: 0 3px; line-height: 1.5;
  }

  /* 可折叠列表 */
  .collapsible {
    position: relative;
    flex-shrink: 0;   /* 关键：侧边栏是 flex 容器，不加会被压成 0 高 */
  }
  .collapsible.collapsed {
    max-height: 150px; overflow: hidden;
  }
  .collapsible.collapsed::after {
    content: '';
    position: absolute; left: 0; right: 0; bottom: 0; height: 52px;
    background: linear-gradient(to bottom, rgba(251,251,252,0), var(--bg-side) 85%);
    pointer-events: none;
  }
  .expand-btn {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    flex-shrink: 0;
    width: 100%; margin-top: 5px; padding: 7px 10px;
    border: none; border-radius: 8px; background: transparent;
    font-size: 11.5px; font-weight: 500; color: var(--text-dim);
    cursor: pointer; font-family: inherit;
    transition: all .15s var(--ease);
  }
  .expand-btn:hover {
    background: var(--bg-hover); color: var(--accent);
  }
  .expand-btn .chev {
    font-size: 9px; transition: transform .2s var(--ease);
  }

  .side-label {
    font-size: 11px; color: var(--text-dim);
    padding: 20px 8px 8px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em;
  }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 10px; border-radius: var(--radius-sm); cursor: pointer;
    transition: background .15s var(--ease); user-select: none;
  }
  .toggle-row:hover { background: var(--bg-hover); }
  .toggle-label {
    display: flex; align-items: center; gap: 9px;
    font-size: 13.5px; font-weight: 450;
  }

  /* 开关 */
  .switch {
    width: 40px; height: 23px; border-radius: 12px;
    background: #d4d4dc; position: relative;
    transition: background .22s var(--ease); flex-shrink: 0;
  }
  .switch::after {
    content: ''; position: absolute; top: 2.5px; left: 2.5px;
    width: 18px; height: 18px; border-radius: 50%; background: #fff;
    transition: transform .22s var(--ease);
    box-shadow: 0 1px 4px rgba(0,0,0,.18);
  }
  .switch.on { background: var(--accent); }
  .switch.on::after { transform: translateX(17px); }

  /* 当前配置信息表 */
  .info-grid {
    padding: 2px 10px 12px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .info-row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11.5px; padding: 3px 0; gap: 10px;
  }
  .info-key { color: var(--text-dim); flex-shrink: 0; }
  .info-val {
    color: var(--text-2); font-weight: 500; text-align: right;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .side-footer {
    margin-top: auto; padding: 14px 10px 8px;
    font-size: 11px; color: var(--text-dim); line-height: 1.6;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .footer-status {
    display: flex; align-items: center; gap: 7px;
    margin-bottom: 8px; font-weight: 500; color: var(--text-2);
  }
  .status-led {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--success); flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(5,150,105,.14);
    animation: ledPulse 2.4s ease-in-out infinite;
  }
  @keyframes ledPulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(5,150,105,.14); }
    50% { box-shadow: 0 0 0 5px rgba(5,150,105,.06); }
  }
  .footer-links {
    display: flex; gap: 10px; margin-bottom: 4px;
    font-size: 11px; opacity: .85;
  }
  .footer-links span { cursor: default; }
  .footer-note { opacity: .6; font-size: 10.5px; }

  /* ============ 知识库 ============ */
  .kb-box { padding: 0 4px; }
  .kb-upload {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    padding: 10px 12px; border: 1.5px dashed var(--border-strong);
    border-radius: var(--radius-sm); cursor: pointer;
    font-size: 13px; font-weight: 450; color: var(--text-2);
    transition: all .18s var(--ease); background: #fff;
  }
  .kb-upload:hover {
    border-color: var(--accent); color: var(--accent);
    background: var(--accent-soft); border-style: solid;
  }
  .kb-upload.busy { opacity: .55; pointer-events: none; }
  .kb-hint {
    font-size: 11.5px; color: var(--text-dim);
    padding: 9px 3px; line-height: 1.5;
  }
  .kb-list {
    display: flex; flex-direction: column; gap: 5px; margin-top: 4px;
  }
  .kb-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; background: #fff; border-radius: 9px;
    font-size: 12.5px; border: 1px solid var(--border);
    transition: all .15s var(--ease);
  }
  .kb-item:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
  .kb-item .name {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--text-2); font-weight: 450;
  }
  .kb-item .chunks {
    color: var(--text-dim); font-size: 11px; flex-shrink: 0;
    background: var(--bg-hover); padding: 1px 6px; border-radius: 5px;
  }
  .kb-item .del {
    cursor: pointer; color: var(--text-dim); font-size: 15px;
    padding: 0 2px; flex-shrink: 0; line-height: 1;
    transition: color .15s;
  }
  .kb-item .del:hover { color: var(--danger); }

  /* ============ 历史对话搜索 ============ */
  .sess-search {
    position: relative; padding: 0 4px 6px;
  }
  .sess-search input {
    width: 100%; padding: 8px 30px 8px 12px;
    border: 1px solid var(--border); border-radius: 9px;
    font-size: 12.5px; font-family: inherit; outline: none;
    background: #fff; color: var(--text);
    transition: all .16s var(--ease);
  }
  .sess-search input::placeholder { color: #b0b0ba; }
  .sess-search input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-ring);
  }
  .sess-search .clear-btn {
    position: absolute; right: 12px; top: 50%;
    transform: translateY(-60%);
    width: 18px; height: 18px; border: none; border-radius: 50%;
    background: var(--bg-hover); color: var(--text-dim);
    font-size: 13px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .14s;
  }
  .sess-search .clear-btn:hover {
    background: var(--text-dim); color: #fff;
  }

  /* 搜索命中高亮 */
  .session-item mark {
    background: #fef08a; color: inherit;
    padding: 0 1px; border-radius: 2px;
  }
  .session-item .s-snippet {
    display: block; font-size: 11px; color: var(--text-dim);
    margin-top: 2px; line-height: 1.4;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .search-empty {
    padding: 16px 12px; text-align: center;
    font-size: 12px; color: var(--text-dim);
    background: var(--bg-hover); border-radius: 9px;
  }

  /* ============ 历史对话 ============ */
  .session-list {
    display: flex; flex-direction: column; gap: 2px; padding: 0 2px;
  }
  .session-item {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 11px; border-radius: 9px; cursor: pointer;
    font-size: 13px; color: var(--text-2); font-weight: 450;
    transition: all .14s var(--ease);
  }
  .session-item:hover { background: var(--bg-hover); color: var(--text); }
  .session-item.active {
    background: var(--accent-soft); color: var(--accent); font-weight: 550;
  }
  .session-item .s-title {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .session-item .s-del {
    display: none; color: var(--text-dim); font-size: 14px;
    padding: 0 3px; line-height: 1; flex-shrink: 0;
    transition: color .15s;
  }
  .session-item:hover .s-del { display: block; }
  .session-item .s-del:hover { color: var(--danger); }
  .session-empty {
    font-size: 12px; color: var(--text-dim);
    padding: 12px; text-align: center;
    background: var(--bg-hover); border-radius: 9px;
  }

  /* ============ 主区域 ============ */
  .main {
    flex: 1; display: flex; flex-direction: column; min-width: 0;
    background: var(--bg);
  }

  .topbar {
    height: 58px; display: flex; align-items: center;
    justify-content: space-between; padding: 0 24px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    backdrop-filter: blur(12px); background: rgba(255,255,255,.86);
  }
  .icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 9px;
    border: 1px solid var(--border); background: #fff;
    color: var(--text-2); cursor: pointer;
    transition: all .16s var(--ease);
  }
  .icon-btn:hover {
    border-color: var(--accent); color: var(--accent);
    background: var(--accent-soft);
    transform: rotate(45deg);
  }

  /* ============ 模型设置面板 ============ */
  .settings-tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border); padding-bottom: 0;
  }
  .stab {
    padding: 10px 16px; border: none; background: none; cursor: pointer;
    font-size: 13.5px; font-weight: 500; color: var(--text-dim);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: all .16s var(--ease); font-family: inherit;
  }
  .stab:hover { color: var(--text); }
  .stab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .form-grid { display: flex; flex-direction: column; gap: 14px; }
  .form-row { display: flex; flex-direction: column; gap: 6px; }
  .form-row.two { flex-direction: row; gap: 12px; }
  .form-row.two > * { flex: 1; min-width: 0; }
  .form-label {
    font-size: 12.5px; font-weight: 550; color: var(--text-2);
    display: flex; align-items: center; gap: 6px;
  }
  .form-label .req { color: var(--danger); }
  .form-hint { font-size: 11px; color: var(--text-dim); line-height: 1.5; }
  .form-input, .form-select, .form-textarea {
    width: 100%; padding: 10px 13px; font-size: 13.5px;
    border: 1px solid var(--border-strong); border-radius: 10px;
    font-family: inherit; outline: none; background: #fff;
    transition: all .16s var(--ease); color: var(--text);
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-ring);
  }
  .form-input::placeholder { color: #b4b4be; }
  .form-textarea { resize: vertical; min-height: 70px; }
  .form-select { cursor: pointer; }

  .check-row { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .check-item {
    display: flex; align-items: center; gap: 7px;
    font-size: 13px; cursor: pointer; user-select: none;
  }
  .check-item input { cursor: pointer; width: 15px; height: 15px; accent-color: var(--accent); }

  .btn-row { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .btn {
    padding: 10px 20px; border-radius: 10px; border: none;
    font-size: 13.5px; font-weight: 500; cursor: pointer;
    font-family: inherit; transition: all .16s var(--ease);
    display: inline-flex; align-items: center; gap: 7px;
  }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-primary {
    background: var(--accent); color: #fff;
    box-shadow: 0 2px 8px rgba(81,69,229,.24);
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--accent-hover);
    box-shadow: 0 4px 14px rgba(81,69,229,.32);
  }
  .btn-ghost {
    background: #fff; color: var(--text-2);
    border: 1px solid var(--border-strong);
  }
  .btn-ghost:hover:not(:disabled) {
    border-color: var(--accent); color: var(--accent);
  }
  .btn-danger { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
  .btn-danger:hover:not(:disabled) { background: #fee2e2; }

  /* 测试结果 */
  .test-result {
    padding: 11px 14px; border-radius: 10px; font-size: 13px;
    display: none; align-items: flex-start; gap: 8px; line-height: 1.5;
    margin-top: 4px;
  }
  .test-result.show { display: flex; }
  .test-result.ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
  .test-result.err { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }

  /* 模型列表 */
  .model-list { display: flex; flex-direction: column; gap: 9px; }
  .model-card {
    border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; transition: all .16s var(--ease);
    background: #fff;
  }
  .model-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
  .mc-head {
    display: flex; align-items: center; gap: 9px; margin-bottom: 5px;
    flex-wrap: wrap;
  }
  .mc-id {
    font-size: 13.5px; font-weight: 600;
    font-family: "SF Mono", ui-monospace, Consolas, monospace;
    color: var(--text);
  }
  .mc-tag {
    font-size: 10.5px; font-weight: 600; padding: 2px 8px;
    border-radius: 5px; background: var(--accent-soft); color: var(--accent);
  }
  .mc-tag.vision { background: #e0f2fe; color: #0369a1; }
  .mc-tag.reason { background: #ffe4e6; color: #be123c; }
  .mc-actions { margin-left: auto; display: flex; gap: 6px; }
  .mc-btn {
    padding: 4px 10px; border-radius: 7px; border: 1px solid var(--border);
    background: #fff; font-size: 11.5px; cursor: pointer;
    color: var(--text-2); font-family: inherit; transition: all .14s;
  }
  .mc-btn:hover { border-color: var(--accent); color: var(--accent); }
  .mc-btn.del:hover { border-color: var(--danger); color: var(--danger); }
  .mc-desc { font-size: 12px; color: var(--text-dim); line-height: 1.55; }
  .mc-meta {
    font-size: 11px; color: var(--text-dim); margin-top: 6px;
    display: flex; gap: 14px; flex-wrap: wrap;
  }
  .mc-meta code {
    background: var(--bg-hover); padding: 1px 6px; border-radius: 4px;
    font-size: 10.5px;
  }

  .empty-hint {
    text-align: center; padding: 40px 20px;
    color: var(--text-dim); font-size: 13px;
    background: var(--bg-side); border-radius: 12px;
  }
  .empty-hint .big { font-size: 30px; margin-bottom: 10px; opacity: .5; }

  .topbar-title {
    font-size: 14.5px; font-weight: 600; letter-spacing: -.01em;
  }
  .status {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--text-dim); font-weight: 450;
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--success);
    box-shadow: 0 0 0 3px rgba(5,150,105,.12);
  }
  .status-dot.busy {
    background: var(--warn);
    box-shadow: 0 0 0 3px rgba(217,119,6,.14);
    animation: pulse 1.3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .45; transform: scale(.86); }
  }

  .messages {
    flex: 1; overflow-y: auto; padding: 32px 0 12px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 9px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb {
    background: #dcdce2; border-radius: 5px;
    border: 2px solid transparent; background-clip: content-box;
  }
  .messages::-webkit-scrollbar-thumb:hover { background: #c4c4cc; background-clip: content-box; }

  .msg-wrap {
    max-width: 900px; margin: 0 auto 28px; padding: 0 32px;
    animation: msgIn .3s var(--ease);
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 用户消息 */
  .msg-user { display: flex; justify-content: flex-end; }
  .msg-user .bubble {
    background: var(--bg-user); padding: 13px 20px;
    border-radius: 20px 20px 6px 20px;
    max-width: 88%;
    white-space: pre-wrap; word-break: break-word;
    font-size: 15px; color: var(--text); line-height: 1.7;
    /* 让短消息按内容宽度显示，不要被容器压窄 */
    width: fit-content;
  }

  /* AI 消息 */
  .msg-ai { display: flex; gap: 14px; }
  .avatar {
    width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 55%, #a855f7 100%);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; font-weight: 750; margin-top: 1px;
    box-shadow: 0 3px 10px rgba(99,102,241,.28);
  }
  .msg-ai .content { flex: 1; min-width: 0; word-break: break-word; }
  .msg-ai .content p { margin: 0 0 12px; }
  .msg-ai .content p:last-child { margin-bottom: 0; }

  .msg-ai .content ul,
  .msg-ai .content ol { margin: 0 0 12px; padding-left: 24px; }
  .msg-ai .content li { margin: 5px 0; }
  .msg-ai .content li::marker { color: var(--text-dim); }

  .msg-ai .content code {
    background: rgba(81,69,229,.07); padding: 2px 6px;
    border-radius: 5px; color: #4c3fd4;
    font-family: "SF Mono", "JetBrains Mono", ui-monospace, Consolas, monospace;
    font-size: .875em; font-weight: 450;
  }
  .msg-ai .content pre {
    background: var(--bg-code); color: #e4e4e9;
    padding: 18px 20px; border-radius: 12px;
    overflow-x: auto; margin: 0 0 14px;
    font-size: 13.5px; line-height: 1.65;
    box-shadow: var(--shadow-md);
  }
  .msg-ai .content pre code {
    background: none; padding: 0; color: inherit;
    font-size: inherit; font-weight: 400;
  }
  .msg-ai .content pre::-webkit-scrollbar { height: 8px; }
  .msg-ai .content pre::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.16); border-radius: 4px;
  }

  .msg-ai .content h1,
  .msg-ai .content h2,
  .msg-ai .content h3 {
    font-size: 16.5px; margin: 20px 0 10px;
    font-weight: 650; letter-spacing: -.01em;
  }
  .msg-ai .content h1:first-child,
  .msg-ai .content h2:first-child,
  .msg-ai .content h3:first-child { margin-top: 0; }

  .msg-ai .content blockquote {
    border-left: 3px solid var(--accent);
    padding: 2px 0 2px 14px; margin: 0 0 12px;
    color: var(--text-2);
  }
  .msg-ai .content a {
    color: var(--accent); text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color .15s;
  }
  .msg-ai .content a:hover { border-bottom-color: var(--accent); }
  .msg-ai .content hr {
    border: none; border-top: 1px solid var(--border); margin: 18px 0;
  }
  .msg-ai .content table {
    border-collapse: collapse; width: 100%; margin: 0 0 14px;
    font-size: 14px;
  }
  .msg-ai .content th,
  .msg-ai .content td {
    border: 1px solid var(--border); padding: 8px 12px;
    text-align: left;
  }
  .msg-ai .content th {
    background: var(--bg-side); font-weight: 600;
  }

  /* 检索结果卡片 */
  .search-panel {
    background: linear-gradient(135deg, #f5f6ff 0%, #f0f4ff 100%);
    border: 1px solid #e0e5ff;
    border-radius: var(--radius-sm);
    padding: 12px 16px; margin-bottom: 16px; font-size: 13px;
  }
  .search-head {
    display: flex; align-items: center; gap: 7px;
    color: var(--accent); font-weight: 550; margin-bottom: 8px;
    font-size: 12.5px;
  }
  .search-item {
    padding: 5px 0; color: #4338ca; line-height: 1.55;
    display: flex; gap: 8px; align-items: baseline;
  }
  .search-item .idx {
    color: var(--accent); font-weight: 650; flex-shrink: 0;
    font-size: 11.5px; font-variant-numeric: tabular-nums;
  }
  .search-item a {
    color: #4338ca; text-decoration: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    border-bottom: 1px solid transparent; transition: border-color .15s;
  }
  .search-item a:hover { border-bottom-color: #4338ca; }

  .spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 1.8px solid currentColor; border-top-color: transparent;
    border-radius: 50%; animation: spin .7s linear infinite;
    opacity: .8;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .cursor-blink {
    display: inline-block; width: 7px; height: 16px;
    background: var(--accent); vertical-align: text-bottom;
    animation: blink .95s step-end infinite; margin-left: 3px;
    border-radius: 1.5px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ============ 空状态 ============ */
  .empty {
    max-width: 720px; margin: 0 auto; padding: 72px 28px 0; text-align: center;
  }
  .empty h1 {
    font-size: 31px; font-weight: 680; margin-bottom: 10px;
    letter-spacing: -.025em;
    background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .empty p {
    color: var(--text-dim); margin-bottom: 40px;
    font-size: 14.5px; font-weight: 400;
  }
  .cards {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  }
  .card {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 17px 19px; text-align: left; cursor: pointer;
    background: #fff; transition: all .2s var(--ease);
    font-family: inherit; box-shadow: var(--shadow-sm);
  }
  .card:hover {
    border-color: #c9c9ff; box-shadow: var(--shadow-md);
    transform: translateY(-2px);
  }
  .card:active { transform: translateY(0); }
  .card-title {
    font-size: 13.5px; font-weight: 600; margin-bottom: 5px;
    display: flex; align-items: center; gap: 7px; color: var(--text);
  }
  .card-desc {
    font-size: 12.5px; color: var(--text-dim); line-height: 1.55;
  }

  /* ============ 输入区 ============ */
  /* ============ 消息队列 ============ */
  .queue-bar {
    margin-bottom: 6px;
    background: #fafafa; border: 1px solid var(--border);
    border-radius: 12px; font-size: 12.5px;
    max-height: 132px; overflow-y: auto;
    animation: queueIn .2s var(--ease);
    scrollbar-width: thin;
  }
  .queue-bar::-webkit-scrollbar { width: 6px; }
  .queue-bar::-webkit-scrollbar-thumb {
    background: #d8d8e0; border-radius: 4px;
    border: 2px solid transparent; background-clip: content-box;
  }
  @keyframes queueIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .queue-bar .q-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px 5px;
    position: sticky; top: 0; background: #fafafa; z-index: 1;
    border-bottom: 1px solid var(--border);
  }
  .queue-bar .q-title {
    font-size: 10.5px; font-weight: 650; color: var(--text-dim);
    letter-spacing: .03em; display: flex; align-items: center; gap: 6px;
  }
  .queue-bar .q-title .q-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #f59e0b; flex-shrink: 0;
  }
  .queue-bar .q-clear {
    border: none; background: none; cursor: pointer;
    font-size: 10.5px; color: var(--text-dim); font-family: inherit;
    padding: 1px 6px; border-radius: 4px; transition: all .14s;
  }
  .queue-bar .q-clear:hover { background: #fee2e2; color: var(--danger); }

  .queue-bar .q-list { display: flex; flex-direction: column; padding: 3px 4px 4px; gap: 1px; }

  /* 单行紧凑布局 */
  .queue-bar .q-item {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 6px; border-radius: 6px;
    transition: background .13s;
  }
  .queue-bar .q-item:hover { background: #fff; }
  .queue-bar .q-idx {
    width: 15px; height: 15px; flex-shrink: 0;
    border-radius: 50%; background: var(--bg-hover);
    font-size: 9.5px; font-weight: 600; color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
  }
  .queue-bar .q-text {
    flex: 1; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
    color: var(--text-2); font-size: 12px;
  }
  .queue-bar .q-attach {
    font-size: 10px; color: var(--text-dim); flex-shrink: 0;
  }

  /* 每条的小按钮 */
  .queue-bar .q-act {
    border: none; background: none; cursor: pointer;
    border-radius: 5px; transition: all .13s;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; padding: 1px 5px;
    font-size: 10px; font-family: inherit; line-height: 1.4;
  }
  .queue-bar .q-send {
    color: var(--accent); font-weight: 600;
    opacity: 0; font-size: 10.5px;
  }
  .queue-bar .q-item:hover .q-send { opacity: 1; }
  .queue-bar .q-send:hover { background: var(--accent-soft); }
  .queue-bar .q-del {
    color: var(--text-dim); font-size: 14px; line-height: 1;
    padding: 0 3px;
  }
  .queue-bar .q-del:hover { color: var(--danger); background: #fef2f2; }

  /* 已插队/发送中提示 */
  .queue-bar .q-item.sending {
    background: #fffbeb; border: 1px dashed #fde68a;
  }
  .queue-bar .q-item.sending .q-text { color: #92400e; }

  .send-btn.queueing {
    background: #f59e0b !important;
    box-shadow: 0 2px 8px rgba(245,158,11,.32) !important;
  }
  .send-btn.queueing:hover {
    background: #d97706 !important;
  }

  .composer-wrap {
    padding: 14px 28px 22px; flex-shrink: 0;
    background: linear-gradient(to top, #fff 62%, rgba(255,255,255,0));
  }
  .composer {
    max-width: 900px; margin: 0 auto;
    border: 1px solid var(--border-strong); border-radius: 18px;
    background: #fff;
    box-shadow: var(--shadow-md);
    transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .composer:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3.5px var(--accent-ring), var(--shadow-md);
  }
  .composer textarea {
    width: 100%; border: none; outline: none; resize: none;
    padding: 18px 22px 8px; font-size: 15px; font-family: inherit;
    line-height: 1.7; max-height: 320px; min-height: 80px;
    background: transparent; color: var(--text);
  }
  .composer textarea::placeholder { color: #a8a8b3; }
  .composer-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 12px 12px 14px; gap: 10px;
  }
  .composer-left {
    display: flex; align-items: center; gap: 7px;
    flex-wrap: wrap; min-width: 0;
  }
  .chip {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 9px;
    border: 1px solid var(--border); background: #fff;
    cursor: pointer; font-size: 12.5px; font-weight: 450;
    color: var(--text-2); font-family: inherit;
    transition: all .15s var(--ease); white-space: nowrap;
  }
  .chip:hover {
    background: var(--bg-hover); border-color: var(--border-strong);
    color: var(--text);
  }
  .chip.active {
    background: var(--accent-soft); border-color: #c7c9ff;
    color: var(--accent); font-weight: 500;
  }
  .send-btn {
    width: 36px; height: 36px; border-radius: 11px; border: none;
    background: var(--accent); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .18s var(--ease); flex-shrink: 0;
    font-size: 16px; font-weight: 600;
    box-shadow: 0 2px 8px rgba(81,69,229,.28);
  }
  .send-btn:hover:not(:disabled) {
    background: var(--accent-hover);
    box-shadow: 0 4px 14px rgba(81,69,229,.36);
    transform: translateY(-1px);
  }
  .send-btn:active:not(:disabled) { transform: translateY(0); }
  .send-btn:disabled {
    background: #e4e4ea; color: #b4b4be; cursor: not-allowed;
    box-shadow: none;
  }
  .hint {
    max-width: 900px; margin: 10px auto 0; text-align: center;
    font-size: 11.5px; color: var(--text-dim);
  }

  /* ============ 模型选择 ============ */
  .model-select { position: relative; }
  .model-chip { gap: 7px; font-weight: 500; }
  .model-menu {
    display: none; position: absolute; bottom: calc(100% + 10px); left: 0;
    background: #fff; border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow-lg);
    padding: 7px; z-index: 60; min-width: 300px;
    max-height: min(52vh, 420px);
    overflow-y: auto;
    overscroll-behavior: contain;
    animation: menuIn .18s var(--ease);
    scrollbar-width: thin;
  }
  .model-menu::-webkit-scrollbar { width: 7px; }
  .model-menu::-webkit-scrollbar-track { background: transparent; }
  .model-menu::-webkit-scrollbar-thumb {
    background: #d8d8e0; border-radius: 4px;
    border: 2px solid transparent; background-clip: content-box;
  }
  .model-menu::-webkit-scrollbar-thumb:hover { background: #c0c0cc; background-clip: content-box; }

  /* 菜单顶部固定的小标题 */
  .menu-sep {
    font-size: 10.5px; font-weight: 650; color: var(--text-dim);
    padding: 8px 12px 4px; letter-spacing: .04em;
    text-transform: uppercase; position: sticky; top: -7px;
    background: #fff; z-index: 1;
  }

  /* 菜单底部：添加模型入口 */
  .menu-add {
    display: flex; align-items: center; gap: 8px;
    margin-top: 6px; padding: 10px 12px;
    border-radius: 9px; cursor: pointer;
    font-size: 12.5px; font-weight: 500; color: var(--accent);
    border: 1px dashed #c7c9ff; background: var(--accent-soft);
    transition: all .15s var(--ease);
    position: sticky; bottom: -7px;
  }
  .menu-add:hover { background: #e5e7ff; border-color: var(--accent); }
  @keyframes menuIn {
    from { opacity: 0; transform: translateY(6px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .model-menu.show { display: block; }
  .model-item {
    padding: 10px 12px; border-radius: 9px; cursor: pointer;
    transition: background .13s var(--ease);
  }
  .model-item:hover { background: var(--bg-hover); }
  .model-item.active { background: var(--accent-soft); }
  .model-item .m-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 2px;
  }
  .model-item .m-name {
    font-size: 13.5px; font-weight: 600; color: var(--text);
    font-family: "SF Mono", ui-monospace, Consolas, monospace;
  }
  .model-item .m-tag {
    font-size: 10.5px; font-weight: 600; padding: 1px 7px;
    border-radius: 5px; letter-spacing: .02em;
  }
  .model-item .m-tag.free { background: #dcfce7; color: #15803d; }
  .model-item .m-tag.strong { background: #fef3c7; color: #b45309; }
  .model-item .m-tag.max { background: #ede9fe; color: #6d28d9; }
  .model-item .m-tag.long { background: #dbeafe; color: #1d4ed8; }
  .model-item .m-tag.reason { background: #ffe4e6; color: #be123c; }
  .model-item .m-tag.new {
    background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
    color: #92400e; font-weight: 700;
  }
  .model-item .m-tag.vision { background: #e0f2fe; color: #0369a1; }
  .model-item .m-tag.code { background: #f3e8ff; color: #7c3aed; }

  /* ============ 思考过程（推理模型） ============ */
  .reasoning-box {
    margin: 0 0 14px;
    border: 1px solid #e8e8ec;
    border-radius: 12px;
    background: #fafafb;
    overflow: hidden;
  }
  .reasoning-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; cursor: pointer;
    font-size: 12.5px; font-weight: 550; color: var(--text-2);
    user-select: none; transition: background .15s;
  }
  .reasoning-head:hover { background: var(--bg-hover); }
  .reasoning-head .arrow {
    font-size: 10px; transition: transform .2s var(--ease);
    color: var(--text-dim);
  }
  .reasoning-box.open .reasoning-head .arrow { transform: rotate(90deg); }
  .reasoning-head .brain { font-size: 13px; }
  .reasoning-head .r-time {
    margin-left: auto; font-size: 11px; color: var(--text-dim);
    font-weight: 400;
  }
  .reasoning-body {
    display: none;
    padding: 4px 16px 14px 16px;
    font-size: 12.5px; line-height: 1.7;
    color: var(--text-dim);
    white-space: pre-wrap; word-break: break-word;
    border-top: 1px solid #f0f0f3;
    max-height: 320px; overflow-y: auto;
  }
  .reasoning-box.open .reasoning-body { display: block; }
  .reasoning-body::-webkit-scrollbar { width: 6px; }
  .reasoning-body::-webkit-scrollbar-thumb {
    background: #dcdce2; border-radius: 3px;
  }
  .model-item .m-desc {
    font-size: 11.5px; color: var(--text-dim);
    line-height: 1.5; padding-left: 1px;
  }

  /* ============ 附件区 ============ */
  .attach-preview {
    display: none; flex-wrap: wrap; gap: 9px;
    padding: 14px 20px 2px;
  }
  .attach-preview.has { display: flex; }
  .attach-item {
    display: flex; align-items: center; gap: 9px;
    background: var(--bg-side); border: 1px solid var(--border);
    border-radius: 10px; padding: 7px 11px; font-size: 12.5px;
    max-width: 240px; transition: all .15s var(--ease);
  }
  .attach-item:hover { border-color: var(--border-strong); }
  .attach-item .a-icon { flex-shrink: 0; font-size: 14px; }
  .attach-item .a-name {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--text-2); font-weight: 450;
  }
  .attach-item .a-del {
    cursor: pointer; color: var(--text-dim); font-size: 15px;
    flex-shrink: 0; line-height: 1; transition: color .15s;
  }
  .attach-item .a-del:hover { color: var(--danger); }
  .attach-item.loading { opacity: .6; }
  .attach-item .a-warn {
    color: var(--warn); font-size: 12px; flex-shrink: 0;
    cursor: help;
  }
  .attach-item.has-warn {
    border-color: #fde68a; background: #fffbeb;
  }

  /* ============ 复制按钮 ============ */
  .copy-btn {
    position: absolute; top: 10px; right: 10px;
    background: rgba(255,255,255,.1); color: #d4d4d9;
    border: none; border-radius: 7px; padding: 5px 11px;
    font-size: 11.5px; font-weight: 500; cursor: pointer;
    transition: all .16s var(--ease); font-family: inherit;
    opacity: 0; backdrop-filter: blur(6px);
  }
  pre:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { background: rgba(255,255,255,.2); color: #fff; }
  .copy-btn.copied {
    background: var(--success); color: #fff; opacity: 1;
  }
  pre { position: relative; }

  /* 时间戳 */
  .msg-meta {
    display: flex; align-items: center; gap: 8px;
    margin-top: 7px; font-size: 11px; color: var(--text-dim);
    opacity: .75;
  }
  .msg-user .msg-meta { justify-content: flex-end; }
  .msg-time { cursor: default; font-variant-numeric: tabular-nums; }
  .msg-col { display: flex; flex-direction: column; align-items: flex-end; max-width: 100%; width: 100%; }

  /* 思考耗时 */
  .reasoning-head .r-elapsed {
    font-size: 10.5px; color: var(--accent);
    font-weight: 600; font-variant-numeric: tabular-nums;
    margin-left: 2px;
  }

  .msg-actions {
    display: flex; align-items: center; gap: 7px;
    margin-top: 10px; position: relative;
  }
  .msg-copy, .msg-download {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    padding: 5px 11px; min-height: 27px;
    background: transparent; border: 1px solid var(--border);
    border-radius: 8px; font-size: 11.5px; font-weight: 450;
    color: var(--text-dim); cursor: pointer;
    transition: all .16s var(--ease); font-family: inherit;
    opacity: 0;
  }
  .msg-wrap:hover .msg-copy,
  .msg-wrap:hover .msg-download { opacity: 1; }
  .msg-copy:hover, .msg-download:hover {
    border-color: var(--accent); color: var(--accent);
    background: var(--accent-soft);
  }
  .msg-download:disabled { opacity: .6; cursor: not-allowed; }

  /* 导出格式菜单 */
  .export-menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 80;
    min-width: 200px; padding: 6px;
    background: #fff; border: 1px solid var(--border);
    border-radius: 11px; box-shadow: var(--shadow-lg);
    animation: menuIn .16s var(--ease);
  }
  .export-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 9px 11px;
    border: none; border-radius: 8px; background: none;
    cursor: pointer; font-family: inherit; text-align: left;
    transition: background .13s var(--ease);
  }
  .export-item:hover { background: var(--bg-hover); }
  .export-item .e-icon { font-size: 15px; flex-shrink: 0; }
  .export-item .e-main { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .export-item .e-name {
    font-size: 13px; color: var(--text); font-weight: 450;
    display: flex; align-items: center; gap: 6px;
  }
  .export-item .e-hint {
    font-size: 10.5px; color: var(--text-dim);
    font-family: "SF Mono", Consolas, monospace; flex-shrink: 0;
  }

  /* 推荐格式 */
  .export-menu .em-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 11px 6px; gap: 10px;
    border-bottom: 1px solid var(--border); margin-bottom: 4px;
  }
  .em-title {
    font-size: 11px; font-weight: 650; color: var(--text-2);
    letter-spacing: .03em;
  }
  .em-stats {
    font-size: 10px; color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .export-item.is-rec { background: var(--accent-soft); }
  .export-item.is-rec:hover { background: #e0e2ff; }
  .em-rec {
    font-size: 9.5px; font-weight: 700; padding: 1px 6px;
    border-radius: 4px; background: var(--accent); color: #fff;
    letter-spacing: .02em;
  }
  .em-reason {
    font-size: 10.5px; color: var(--accent);
    opacity: .85; line-height: 1.3;
  }

  /* ============ 模态框 ============ */
  .modal-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(16,16,20,.42); z-index: 200;
    backdrop-filter: blur(3px);
    animation: fadeIn .2s var(--ease);
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-backdrop.show { display: block; }
  .modal {
    display: none; position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%); z-index: 201;
    width: min(760px, 93vw); max-height: 84vh;
    background: #fff; border-radius: 18px;
    box-shadow: var(--shadow-lg);
    flex-direction: column; overflow: hidden;
    animation: modalIn .22s var(--ease);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translate(-50%, -48%) scale(.97); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .modal.show { display: flex; }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px; border-bottom: 1px solid var(--border);
    font-size: 15px; font-weight: 650; flex-shrink: 0;
    letter-spacing: -.01em;
  }
  .modal-close {
    background: none; border: none; font-size: 24px; cursor: pointer;
    color: var(--text-dim); line-height: 1; padding: 0 5px;
    transition: color .15s; border-radius: 6px;
  }
  .modal-close:hover { color: var(--text); background: var(--bg-hover); }
  .modal-body {
    padding: 20px 22px; overflow-y: auto; font-size: 14px;
  }
  .modal-body::-webkit-scrollbar { width: 8px; }
  .modal-body::-webkit-scrollbar-thumb {
    background: #dcdce2; border-radius: 4px;
  }

  /* 指标卡 */
  .metric-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px; margin-bottom: 22px;
  }
  .metric {
    background: var(--bg-side); border-radius: var(--radius);
    padding: 16px 18px; border: 1px solid var(--border);
  }
  .metric-label {
    font-size: 11.5px; color: var(--text-dim); margin-bottom: 7px;
    font-weight: 500;
  }
  .metric-value {
    font-size: 24px; font-weight: 680; color: var(--accent);
    letter-spacing: -.02em; font-variant-numeric: tabular-nums;
  }
  .metric-value.good { color: var(--success); }
  .metric-value.warn { color: var(--warn); }

  /* 评估结果 */
  .eval-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px;
    border-radius: 8px; font-size: 13px;
    border-bottom: 1px solid #f2f2f5;
    transition: background .13s;
  }
  .eval-row:hover { background: var(--bg-side); }
  .eval-row:last-child { border-bottom: none; }
  .eval-mark {
    flex-shrink: 0; font-size: 13px; width: 16px; font-weight: 700;
  }
  .eval-mark.ok { color: var(--success); }
  .eval-mark.no { color: var(--danger); }
  .eval-q {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .eval-score {
    font-size: 11.5px; color: var(--text-dim); flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  /* 调试视图 */
  .debug-input {
    display: flex; gap: 10px; margin-bottom: 18px;
  }
  .debug-input input {
    flex: 1; padding: 10px 14px;
    border: 1px solid var(--border-strong); border-radius: 10px;
    font-size: 14px; font-family: inherit; outline: none;
    transition: all .16s var(--ease);
  }
  .debug-input input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-ring);
  }
  .debug-input button {
    padding: 10px 20px; border-radius: 10px; border: none;
    background: var(--accent); color: #fff; cursor: pointer;
    font-size: 14px; font-weight: 500; font-family: inherit;
    transition: all .16s var(--ease);
    box-shadow: 0 2px 8px rgba(81,69,229,.24);
  }
  .debug-input button:hover { background: var(--accent-hover); }
  .debug-section-title {
    font-size: 11.5px; color: var(--text-dim);
    margin: 18px 0 10px; font-weight: 650;
    text-transform: uppercase; letter-spacing: .06em;
  }
  .debug-chip {
    display: inline-block; padding: 5px 11px;
    background: var(--accent-soft); color: var(--accent);
    border-radius: 8px; font-size: 12px; margin: 0 7px 7px 0;
    font-weight: 450;
  }
  .debug-cand {
    display: flex; gap: 12px; padding: 8px 0; font-size: 12px;
    border-bottom: 1px solid #f2f2f5; align-items: baseline;
  }
  .debug-cand .scores {
    flex-shrink: 0; font-family: "SF Mono", ui-monospace, monospace;
    font-size: 11px; color: var(--accent); font-weight: 550;
    font-variant-numeric: tabular-nums;
  }
  .debug-cand .txt {
    flex: 1; color: var(--text-dim);
    overflow: hidden; text-overflow: ellipsis;
  }

  /* ============ 移动端 ============ */
  .menu-btn {
    display: none; background: none; border: none; cursor: pointer;
    font-size: 20px; color: var(--text); padding: 6px;
    border-radius: 8px; transition: background .15s;
  }
  .menu-btn:hover { background: var(--bg-hover); }

  @media (max-width: 820px) {
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 100;
      transform: translateX(-100%);
      box-shadow: 4px 0 24px rgba(0,0,0,.12);
      width: 280px;
    }
    .sidebar.open { transform: translateX(0); }
    .menu-btn { display: block; }
    .msg-wrap { padding: 0 16px; margin-bottom: 22px; }
    .composer-wrap { padding: 10px 14px 16px; }
    .messages { padding: 20px 0 8px; }
    .cards { grid-template-columns: 1fr; }
    .empty { padding-top: 44px; }
    .empty h1 { font-size: 24px; }
    .empty p { margin-bottom: 28px; }
    .topbar { padding: 0 16px; height: 54px; }
    .attach-item { max-width: 180px; }
  }
  .backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(16,16,20,.36); z-index: 99;
    backdrop-filter: blur(2px);
  }
  .backdrop.show { display: block; }
</style>
</head>
<body>
<div class="layout">

  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-dot">AI</div>
      <span>Agent 演示</span>
    </div>

    <button class="btn-new" onclick="newChat()">
      <span style="font-size:16px;line-height:1">+</span> 新对话
    </button>

    <div class="side-label">知识库</div>

    <div class="kb-box" id="kbBox">
      <label class="kb-upload" id="kbUploadLabel">
        <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md,.csv" hidden>
        <span>📎 上传文档</span>
      </label>
      <div class="kb-hint" id="kbHint">上传 PDF/Word/文本，AI 会基于文档回答</div>
      <div class="collapsible" id="kbWrap">
        <div class="kb-list" id="kbList"></div>
      </div>
      <button class="expand-btn" id="kbExpand" onclick="toggleKbList()" style="display:none">
        <span class="txt">展开全部</span><span class="chev">▼</span>
      </button>
    </div>

    <div class="side-label">
      历史对话
      <span id="sessCount" style="float:right;font-weight:400;opacity:.7"></span>
    </div>
    <div class="sess-search">
      <input type="text" id="sessSearch" placeholder="搜索对话内容…"
        oninput="onSessionSearch(this.value)">
      <button class="clear-btn" id="sessSearchClear" onclick="clearSessionSearch()"
        style="display:none" title="清空">×</button>
    </div>
    <div class="collapsible" id="sessWrap">
      <div class="session-list" id="sessionList"></div>
    </div>
    <button class="expand-btn" id="sessExpand" onclick="toggleSessList()" style="display:none">

    <div class="side-label">能力</div>

    <div class="toggle-row" onclick="toggleSearch()">
      <div class="toggle-label">🌐 联网搜索</div>

    </button>

    <div class="side-label">调试</div>

    <button class="btn-new" onclick="openDebug()" style="margin:0 6px">
      <span>🔬</span> 检索过程
    </button>

    <div class="side-label">模型</div>

    <div style="padding: 0 4px; display:flex; flex-direction:column; gap:6px">

    <div class="side-label">当前配置</div>
    <div class="info-grid">
      <div class="info-row">
        <span class="info-key">模型</span>
        <span class="info-val" id="aboutModel">—</span>
      </div>
      <div class="info-row">
        <span class="info-key">知识库</span>
        <span class="info-val" id="aboutKb">—</span>
      </div>
      <div class="info-row">
        <span class="info-key">联网搜索</span>
        <span class="info-val">360 / Bing / 搜狗</span>
      </div>
      <div class="info-row">
        <span class="info-key">上下文</span>
        <span class="info-val" id="aboutCtx">—</span>
      </div>
    </div>

    <div class="side-footer">
      <div class="footer-status">
        <span class="status-led"></span>
        <span id="footerStatus">本地服务运行中</span>
      </div>
      <div class="footer-links">
        <span title="所有数据都在本机处理，不上传">🔒 数据不出本机</span>
        <span title="回答由大模型生成">✨ AI 生成</span>
      </div>
      <div class="footer-note">重要信息请自行核实</div>
    </div>
  </aside>

  <div class="backdrop" id="backdrop" onclick="closeSidebar()"></div>

  <!-- 主区域 -->
  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="menu-btn" onclick="openSidebar()">☰</button>
        <div class="topbar-title">AI 助手</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px">
        <div class="status">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">就绪</span>
        </div>
        <button class="icon-btn" id="settingsBtn" onclick="openSettings()" title="模型设置">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.36.43.65.79.79H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="empty" id="empty">
        <h1>有什么可以帮你？</h1>
        <p>支持联网搜索，回答会标注信息来源</p>
        <div class="cards">
          <button class="card" onclick="ask('2026年 AI Agent 的发展趋势是什么？')">
            <div class="card-title">🔍 联网查资料</div>
            <div class="card-desc">2026年 AI Agent 的发展趋势是什么？</div>

            <div class="card-title">💡 概念解释</div>
            <div class="card-desc">什么是 RAG，为什么能减少幻觉？</div>
          </button>
          <button class="card" onclick="ask('写一个 Python 的 FastAPI 接口，要求支持流式返回大模型输出')">
            <div class="card-title">💻 写代码</div>
            <div class="card-desc">FastAPI 流式返回大模型输出</div>

            <div class="card-title">🎯 职业建议</div>
            <div class="card-desc">研一想找 AI 实习，怎么准备？</div>

    <div class="composer-wrap">
      <!-- 消息队列 -->
      <div class="queue-bar" id="queueBar" style="display:none"></div>

        <div class="attach-preview" id="attachPreview"></div>
        <textarea id="input" rows="1"
          placeholder="输入问题…  支持粘贴图片/文件，Enter 发送，Shift+Enter 换行"></textarea>
        <div class="composer-bar">
          <div class="composer-left">
            <!-- 模型选择 -->
            <div class="model-select" id="modelSelect">
              <button class="chip model-chip" id="modelBtn" onclick="toggleModelMenu(event)">
                <span id="modelLabel">qwen-flash</span>
                <span style="opacity:.5;font-size:10px">▼</span>
              </button>
              <div class="model-menu" id="modelMenu"></div>
            </div>
            <!-- 附件按钮 -->
            <button class="chip" id="attachBtn" onclick="document.getElementById('attachInput').click()" title="上传文件或图片">
              📎
            </button>

              accept=".pdf,.docx,.txt,.md,.csv,.png,.jpg,.jpeg,.webp">

              🌐 本轮必搜

    </div>

<script>
// ============ 状态 ============
let sessionId = '';
let searchEnabled = true;
let forceSearch = false;
let busy = false;
let currentModel = "";
let availableModels = [];
let pendingAttachments = [];   // [{name, text, type}]

// ============ 访问密码 ============
// 服务端设置了 ACCESS_PASSWORD 时，前端需要带上它。
// 存在 localStorage 里，刷新页面不用重输。
function getPassword() {
  return localStorage.getItem("agent_pw") || "";
}

function promptPassword(onOk) {
  const pw = window.prompt("这个服务需要访问密码（由服务提供者设置）");
  if (pw === null) return;
  localStorage.setItem("agent_pw", pw);
  if (onOk) onOk();
}

// 启动时检测是否需要密码
async function initAuth() {
  try {
    const h = await fetch("/api/health").then(r => r.json());
    if (h.auth_required && !getPassword()) {
      promptPassword();
    }
  } catch (e) {}
}

// ============ 模型选择 ============

async function loadModels() {
  try {
    const r = await fetch("/api/models", { headers: { "X-Password": getPassword() } });
    if (!r.ok) return;
    const d = await r.json();
    availableModels = d.models || [];
    currentModel = localStorage.getItem("agent_model") || d.default || "";
    // 更新侧边栏自定义模型数
    const customCount = (d.models || []).filter(x => x.custom).length;
    const badge = document.getElementById("customCount");
    if (badge) badge.textContent = customCount;
    const hint = document.getElementById("modelHint");
    if (hint) {
      hint.textContent = customCount > 0
        ? "已添加 " + customCount + " 个自定义模型"
        : "支持任意 OpenAI 兼容接口";
    }
    if (!availableModels.some(m => m.id === currentModel)) {
      currentModel = d.default || (availableModels[0] && availableModels[0].id) || "";
    }
    updateModelLabel();
    renderModelMenu();
  } catch (e) {}
}

function updateModelLabel() {
  const m = availableModels.find(x => x.id === currentModel);
  const el = document.getElementById("modelLabel");
  if (el) el.textContent = m ? m.id : (currentModel || "qwen-flash");
  const about = document.getElementById("aboutModel");
  if (about) about.textContent = m ? m.id : (currentModel || "—");
}

// 更新侧边栏的统计信息
function updateSidebarStats(docCount, chunkCount) {
  const kb = document.getElementById("aboutKb");
  if (kb) {
    kb.textContent = docCount > 0
      ? docCount + " 文档 / " + chunkCount + " 块"
      : "空";
  }
}

function updateContextStat(rounds) {
  const el = document.getElementById("aboutCtx");
  if (el) el.textContent = rounds + " 轮对话";
}

function renderModelMenu() {
  const box = document.getElementById("modelMenu");
  if (!box) return;

  const builtin = availableModels.filter(m => !m.custom);
  const custom = availableModels.filter(m => m.custom);

  function itemHtml(m) {
    const cls = m.id === currentModel ? " active" : "";
    const tag = m.tag || "";
    let tagCls = "free";
    if (tag.includes("最新")) tagCls = "new";
    else if (tag.includes("视觉")) tagCls = "vision";
    else if (tag.includes("代码")) tagCls = "code";
    else if (tag.includes("最强") || tag.includes("旗舰")) tagCls = "max";
    else if (tag.includes("长")) tagCls = "long";
    else if (tag.includes("推理")) tagCls = "reason";
    else if (tag.includes("更强")) tagCls = "strong";
    const tagHtml = tag
      ? '<span class="m-tag ' + tagCls + '">' + escapeHtml(tag) + "</span>"
      : "";
    return '<div class="model-item' + cls + '" data-model="' + m.id + '">' +
      '<div class="m-row"><span class="m-name">' + escapeHtml(m.id) + "</span>" +
      tagHtml + "</div>" +
      '<div class="m-desc">' + escapeHtml(m.desc || "") + "</div></div>";
  }

  let html = "";
  if (builtin.length) {
    html += '<div class="menu-sep">内置模型</div>';
    html += builtin.map(itemHtml).join("");
  }
  if (custom.length) {
    html += '<div class="menu-sep">我的模型</div>';
    html += custom.map(itemHtml).join("");
  }
  html += '<div class="menu-add" onclick="event.stopPropagation();closeModelMenu();openSettings()">' +
    "<span>＋</span><span>添加自定义模型</span></div>";

  box.innerHTML = html;
  box.querySelectorAll(".model-item").forEach(el => {
    el.addEventListener("click", () => {
      currentModel = el.dataset.model;
      localStorage.setItem("agent_model", currentModel);
      updateModelLabel();
      renderModelMenu();
      closeModelMenu();
      // 换了模型，重新判断图片附件是否可识别
      const meta = availableModels.find(m => m.id === currentModel);
      pendingAttachments.forEach(a => {
        if (a.type === "image" && a.dataUrl) {
          a.warn = (meta && meta.vision) ? "" : "当前模型不支持识图";
        }
      });
      renderAttachments();
    });
  });
}

function toggleModelMenu(e) {
  if (e) e.stopPropagation();
  const menu = document.getElementById("modelMenu");
  if (menu) menu.classList.toggle("show");
}

function closeModelMenu() {
  const menu = document.getElementById("modelMenu");
  if (menu) menu.classList.remove("show");
}

document.addEventListener("click", e => {
  const sel = document.getElementById("modelSelect");
  if (sel && !sel.contains(e.target)) closeModelMenu();
});

// ============ 附件 ============

function renderAttachments() {
  const box = document.getElementById("attachPreview");
  if (!box) return;
  if (!pendingAttachments.length) {
    box.classList.remove("has");
    box.innerHTML = "";
    return;
  }
  box.classList.add("has");
  box.innerHTML = pendingAttachments.map((a, i) => {
    const icon = a.type === "image" ? "🖼️" : "📄";
    const warn = a.warn ? '<span class="a-warn" title="' + escapeHtml(a.warn) + '">⚠</span>' : "";
    return '<div class="attach-item' + (a.loading ? " loading" : "") +
      (a.warn ? " has-warn" : "") + '"' +
      (a.warn ? ' title="' + escapeHtml(a.warn) + '"' : "") + ">" +
      '<span class="a-icon">' + icon + "</span>" +
      '<span class="a-name">' + escapeHtml(a.name) + "</span>" +
      warn +
      (a.loading ? '<span class="spinner"></span>' :
        '<span class="a-del" data-i="' + i + '">×</span>') +
      "</div>";
  }).join("");
  box.querySelectorAll(".a-del").forEach(el => {
    el.addEventListener("click", () => {
      pendingAttachments.splice(+el.dataset.i, 1);
      renderAttachments();
    });
  });
}

async function addAttachment(file) {
  const name = file.name || ("粘贴的图片." + (file.type.split("/")[1] || "png"));
  const isImage = file.type.startsWith("image/");
  const item = { name, type: isImage ? "image" : "doc", text: "", loading: true };
  pendingAttachments.push(item);
  renderAttachments();

  try {
    const fd = new FormData();
    fd.append("file", file, name);
    const r = await fetch("/api/attach", {
      method: "POST",
      headers: { "X-Password": getPassword() },
      body: fd
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "解析失败");
    item.text = d.text || "";
    item.dataUrl = d.data_url || "";
    item.name = d.name || name;
    item.type = d.type || (isImage ? "image" : "doc");
    item.loading = false;

    // 图片 + 当前模型不支持视觉 → 提示一下
    if (item.type === "image" && item.dataUrl) {
      const meta = availableModels.find(m => m.id === currentModel);
      if (!meta || !meta.vision) {
        item.warn = "当前模型不支持识图";
      }
    }
  } catch (e) {
    const idx = pendingAttachments.indexOf(item);
    if (idx >= 0) pendingAttachments.splice(idx, 1);
    alert("附件处理失败：" + e.message);
  }
  renderAttachments();
  updateSendState();
}

function updateSendState() {
  const hasText = inputEl.value.trim().length > 0;
  const hasAttach = pendingAttachments.some(a => !a.loading);
  const isBusy = busy || queueRunning || parallelTasks > 0;

  // 有内容就能发（忙碌时进队列）
  sendBtn.disabled = !hasText && !hasAttach;

  // 忙碌时按钮变橙色 + 换个图标，提示"会排队"
  sendBtn.classList.toggle("queueing", isBusy && (hasText || hasAttach));
  if (isBusy && (hasText || hasAttach)) {
    sendBtn.textContent = "＋";
    sendBtn.title = "加入队列（可点队列里的「发送」立即并行）";
  } else {
    sendBtn.textContent = "↑";
    sendBtn.title = "发送";
  }
}

async function switchSession(sid) {
  if (busy) return;
  try {
    const r = await fetch("/api/sessions/" + sid, {
      headers: { "X-Password": getPassword() }
    });
    if (!r.ok) return;
    const d = await r.json();
    sessionId = sid;
    messagesEl.innerHTML = "";
    const msgs = (d.messages || []).filter(m => m.role !== "system");
    for (const m of msgs) {
      if (m.role === "user") {
        addUserMsg(m.content);
        if (m.created) setLastMsgTime(".msg-user", m.created * 1000);
      } else if (m.role === "assistant") {
        const c = addAiMsg();
        const b = c.querySelector(".body");
        if (b) b.innerHTML = renderMarkdown(m.content);
        enhanceCopyButtons(b);
        addMsgCopyButton(c.parentElement, () => m.content);
        if (m.created) setLastMsgTime(".msg-ai", m.created * 1000);
        // 恢复思考过程
        if (m.reasoning) {
          const box = document.createElement("div");
          box.className = "reasoning-box";
          const secs = m.thinking_ms ? (m.thinking_ms / 1000).toFixed(1) : null;
          box.innerHTML =
            '<div class="reasoning-head">' +
              '<span class="arrow">▶</span>' +
              '<span class="brain">💭</span>' +
              '<span class="r-label">已深度思考</span>' +
              (secs ? '<span class="r-elapsed">· ' + secs + "s</span>" : "") +
              '<span class="r-time">· ' + m.reasoning.length + " 字</span>" +
            "</div>" +
            '<div class="reasoning-body"></div>';
          box.querySelector(".reasoning-body").textContent = m.reasoning;
          box.querySelector(".reasoning-head").addEventListener("click", () => {
            box.classList.toggle("open");
          });
          c.querySelector(".search-slot").after(box);
        }
      }
    }
    if (!msgs.length) showEmptyState();
    updateContextStat(Math.floor(msgs.length / 2));
    scrollBottom();
    loadSessions();
  } catch (e) {}
}

async function doSessionSearch(keyword) {
  const box = document.getElementById("sessionList");
  if (!box) return;
  box.innerHTML = '<div class="search-empty"><span class="spinner"></span> 搜索中…</div>';
  searchMode = true;

  try {
    const r = await fetch("/api/sessions/search/" + encodeURIComponent(keyword), {
      headers: { "X-Password": getPassword() },
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    renderSearchResults(d.results || [], keyword);

    const wrap = document.getElementById("sessWrap");
    if (wrap) wrap.classList.remove("collapsed");
    const btn = document.getElementById("sessExpand");
    if (btn) btn.style.display = "none";
  } catch (e) {
    box.innerHTML = '<div class="search-empty">搜索失败：' + escapeHtml(e.message) + "</div>";
  }
}

function renderSearchResults(results, keyword) {
  const box = document.getElementById("sessionList");
  if (!box) return;

  if (!results.length) {
    box.innerHTML = '<div class="search-empty">没有找到包含「' + escapeHtml(keyword) + "」的对话</div>";
    return;
  }

  function hl(text) {
    const safe = escapeHtml(String(text || ""));
    const esc = keyword.replace(/[.*+?^$()|[\]\\]/g, "\\$&");
    try {
      return safe.replace(new RegExp("(" + esc + ")", "gi"), "<mark>$1</mark>");
    } catch (e) {
      return safe;
    }
  }

  box.innerHTML = results.map(function (r) {
    const active = r.session_id === sessionId ? " active" : "";
    const snippet = r.snippet ? '<span class="s-snippet">' + hl(r.snippet) + "</span>" : "";
    return (
      '<div class="session-item' + active + '" data-sid="' + r.session_id + '">' +
        '<div style="flex:1;min-width:0">' +
          '<div class="s-title">' + hl(r.title || "新对话") + "</div>" +
          snippet +
        "</div>" +
        '<span class="s-del" data-del="' + r.session_id + '">×</span>' +
      "</div>"
    );
  }).join("");

  box.querySelectorAll(".session-item").forEach(function (el) {
    el.addEventListener("click", function (e) {
      if (e.target.dataset.del) {
        e.stopPropagation();
        deleteSession(e.target.dataset.del);
        return;
      }
      switchSession(el.dataset.sid);
    });
  });
}

function escapeHtml(s) {

          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    // 降级：clipboard API 不可用（http 非安全上下文）时用 execCommand
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e2) {}
    document.body.removeChild(ta);
  }
  if (btn) {
    const old = btn.textContent;
    btn.textContent = "已复制";
    btn.classList.add("copied");
    setTimeout(() => {
      btn.textContent = old;
      btn.classList.remove("copied");
    }, 1500);
  }
}

function enhanceCopyButtons(container) {
  // 给每个代码块加复制按钮
  container.querySelectorAll("pre").forEach(pre => {
    if (pre.querySelector(".copy-btn")) return;

    btn.textContent = "复制";

      e.stopPropagation();
      const code = pre.querySelector("code") || pre;

  });
}

  }
}

function nowClock() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  return hh + ":" + mm;
}

function smartTime(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  if (sameDay) return hh + ":" + mm;
  const yesterday = new Date(now);
  yesterday.setDate(now.getDate() - 1);
  if (d.toDateString() === yesterday.toDateString()) return "昨天 " + hh + ":" + mm;
  if (d.getFullYear() === now.getFullYear()) {
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + hh + ":" + mm;
  }
  return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate();
}

/**
 * 分析回答内容，推荐合适的导出格式。
 * 返回按推荐度排序的格式列表。
 */
function analyzeContentForExport(text) {
  const t = text || "";
  const lines = t.split("\n");

  // 统计各类结构
  const stats = {
    codeBlocks: (t.match(/```/g) || []).length / 2,
    tables: (t.match(/^\|.*\|\s*$/gm) || []).length,
    headings: (t.match(/^#{1,6}\s/gm) || []).length,
    listItems: (t.match(/^\s*[-*+]\s|^\s*\d+\.\s/gm) || []).length,
    links: (t.match(/\[[^\]]+\]\([^)]+\)/g) || []).length,
    bold: (t.match(/\*\*[^*]+\*\*/g) || []).length,
    chars: t.length,
    paragraphs: t.split(/\n{2,}/).filter(p => p.trim()).length,
  };

  const hasCode = stats.codeBlocks > 0;
  const hasTable = stats.tables >= 2;
  const isLong = stats.chars > 1500;
  const isShort = stats.chars < 200;
  const isStructured = stats.headings >= 2 || hasTable;

  // 打分
  const scores = { docx: 50, pdf: 50, html: 50, md: 50, txt: 50 };
  const reasons = {};

  // 代码多 → Markdown 最合适（保留语法）
  if (hasCode) {
    scores.md += 35;
    scores.docx += 15;
    scores.txt -= 30;
    reasons.md = "保留代码高亮格式";
  }

  // 有表格 + 结构化 → Word
  if (hasTable && isStructured) {
    scores.docx += 30;
    scores.pdf += 10;
    reasons.docx = "含表格，Word 便于编辑";
  }

  // 长文档 → Word 或 PDF
  if (isLong && isStructured) {
    scores.pdf += 25;
    scores.docx += 25;
    if (!reasons.pdf) reasons.pdf = "长文档，PDF 适合阅读分享";
    if (!reasons.docx) reasons.docx = "长文档，Word 便于继续编辑";
  }

  // 短回答 → txt 就够（但要排除含链接的情况）
  if (isShort && !hasTable && stats.codeBlocks === 0 && stats.links < 2) {
    scores.txt += 40;
    scores.md += 10;
    reasons.txt = "内容简短，纯文本即可";
  }

  // 有链接 → HTML 可点击（这是 HTML 最大的优势）
  if (stats.links >= 2) {
    scores.html += 55;
    scores.txt -= 25;
    reasons.html = "含 " + stats.links + " 个链接，HTML 可点击";
  }

  // 标题多的长文 → HTML
  if (stats.headings >= 3 && isLong) {
    scores.html += 20;
  }

  // 小标题多 → Word 大纲清晰
  if (stats.headings >= 3) {
    scores.docx += 15;
  }

  // 排序
  const fmtList = [
    { id: "docx", icon: "📝", name: "Word 文档", hint: ".docx" },
    { id: "pdf", icon: "📕", name: "PDF 文件", hint: ".pdf" },
    { id: "html", icon: "🌐", name: "网页 HTML", hint: ".html" },
    { id: "md", icon: "📋", name: "Markdown", hint: ".md" },
    { id: "txt", icon: "📄", name: "纯文本", hint: ".txt" },
  ].map(f => ({ ...f, score: scores[f.id], reason: reasons[f.id] || "" }));

  fmtList.sort((a, b) => b.score - a.score);

  // 标记最优，并保证它有说明
  if (fmtList.length) {
    fmtList[0].recommended = true;
    if (!fmtList[0].reason) {
      const id = fmtList[0].id;
      fmtList[0].reason =
        id === "docx" ? "结构清晰，便于编辑排版" :
        id === "pdf" ? "排版固定，适合打印分享" :
        id === "html" ? "带样式，浏览器直接打开" :
        id === "md" ? "保留 Markdown 格式" : "纯文本，兼容性最好";
    }
  }

  return { formats: fmtList, stats: stats };
}

function toggleExportMenu(wrap, anchorBtn, text) {

async function downloadAnswer(text, fmt, btn) {
  const old = btn ? btn.innerHTML : "";
  if (btn) { btn.disabled = true; btn.innerHTML = "<span class=\"spinner\"></span>"; }
  try {
    // 标题取第一行（如果是标题）或前 30 字
    let title = "AI 回答";
    const firstLine = (text || "").trim().split("\n")[0] || "";
    if (firstLine.startsWith("#")) {
      title = firstLine.replace(/^#+\s*/, "").slice(0, 40);
    } else if (firstLine.length > 4) {
      title = firstLine.replace(/[*`#]/g, "").slice(0, 30);
    }

    const r = await fetch("/api/export", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Password": getPassword() },
      body: JSON.stringify({
        content: text,
        title: title,
        format: fmt,
        meta: {
          "模型": currentModel || "-",
          "会话": sessionId ? sessionId.slice(0, 8) : "-",
        },
      }),
    });

    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.detail || "导出失败");
    }

    // 从响应头取文件名
    const cd = r.headers.get("Content-Disposition") || "";
    let fname = "answer." + fmt;
    const m = cd.match(/filename\*=UTF-8''([^;]+)/);
    if (m) fname = decodeURIComponent(m[1]);

    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);

    if (btn) {
      btn.innerHTML = "✓ 已下载";
      setTimeout(() => { btn.innerHTML = old; btn.disabled = false; }, 1800);
    }
  } catch (e) {
    alert("下载失败：" + e.message);
    if (btn) { btn.innerHTML = old; btn.disabled = false; }
  }
}
function renderMarkdown(text) {
  const blocks = [];
  // 先把代码围栏抽出来，避免内部被二次处理
  let src = text;
  const fenceOpen = String.fromCharCode(96, 96, 96);
  let guard = 0;
  while (src.indexOf(fenceOpen) !== -1 && guard++ < 50) {
    const a = src.indexOf(fenceOpen);
    const rest = src.slice(a + 3);
    const nl = rest.indexOf(String.fromCharCode(10));
    const b = nl === -1 ? rest.indexOf(fenceOpen) : rest.slice(nl).indexOf(fenceOpen);
    if (b === -1) break;
    const bodyStart = nl === -1 ? a + 3 : a + 3 + nl + 1;
    const bodyEnd = nl === -1 ? a + 3 + b : a + 3 + nl + b;
    const code = src.slice(bodyStart, bodyEnd).replace(/^\n+|\n+$/g, "");
    const idx = blocks.length;
    blocks.push("<pre><code>" + escapeHtml(code) + "</code></pre>");
    const closeEnd = bodyEnd + 3;
    src = src.slice(0, a) + "\u0001" + idx + "\u0001" + src.slice(closeEnd);
  }

  src = escapeHtml(src);

  // 行内代码
  const bt = String.fromCharCode(96);
  const inlineRe = new RegExp(bt + "([^" + bt + "]+)" + bt, "g");
  src = src.replace(inlineRe, "<code>$1</code>");

  // 标题
  src = src.replace(/^### (.+)$/gm, "<h3>$1</h3>");
  src = src.replace(/^## (.+)$/gm, "<h2>$1</h2>");
  src = src.replace(/^# (.+)$/gm, "<h1>$1</h1>");

  // 引用
  src = src.replace(/^&gt; (.+)$/gm, "<blockquote>$1</blockquote>");

  // 粗体：用字面量正则，避免动态拼接通配符导致的转义问题
  src = src.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");

  // 链接
  src = src.replace(/\[([^\]]+)\]\(([^)]+)\)/g,
    "<a href=\"$2\" target=\"_blank\" rel=\"noopener\">$1</a>");

  // 表格 + 列表
  const lines = src.split("\n");
  const out = [];
  let listType = null;
  let i = 0;

  // 判断某行是否是表格分隔行（|---|---|）
  const isTableSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);

  while (i < lines.length) {
    const line = lines[i];

    // ---- 表格检测：当前行含 |，下一行是分隔行 ----
    if (line.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      if (listType) { out.push("</" + listType + ">"); listType = null; }

      const splitRow = (row) => {
        let r = row.trim();
        if (r.startsWith("|")) r = r.slice(1);
        if (r.endsWith("|")) r = r.slice(0, -1);
        return r.split("|").map(c => c.trim());
      };

      const headers = splitRow(line);
      i += 2;  // 跳过表头行和分隔行

      let tbl = "<table><thead><tr>";
      headers.forEach(h => { tbl += "<th>" + h + "</th>"; });
      tbl += "</tr></thead><tbody>";

      while (i < lines.length && lines[i].includes("|") && lines[i].trim() !== "") {
        const cells = splitRow(lines[i]);
        tbl += "<tr>";
        for (let c = 0; c < headers.length; c++) {
          tbl += "<td>" + (cells[c] !== undefined ? cells[c] : "") + "</td>";
        }
        tbl += "</tr>";
        i++;
      }
      tbl += "</tbody></table>";
      out.push(tbl);
      continue;
    }

    // ---- 列表 ----
    const ul = line.match(/^\s*[-*+] (.+)$/);
    const ol = line.match(/^\s*\d+\. (.+)$/);
    if (ul) {
      if (listType !== "ul") { if (listType) out.push("</" + listType + ">"); out.push("<ul>"); listType = "ul"; }
      out.push("<li>" + ul[1] + "</li>");
    } else if (ol) {
      if (listType !== "ol") { if (listType) out.push("</" + listType + ">"); out.push("<ol>"); listType = "ol"; }
      out.push("<li>" + ol[1] + "</li>");
    } else {
      if (listType) { out.push("</" + listType + ">"); listType = null; }
      out.push(line);
    }
    i++;
  }
  if (listType) out.push("</" + listType + ">");
  src = out.join("\n");

  // 段落
  src = src.split(/\n{2,}/).map(function (p) {
    p = p.trim();
    if (!p) return "";
    if (/^<(h[123]|ul|ol|pre|blockquote|div|table)/.test(p)) return p;
    return "<p>" + p.replace(/\n/g, "<br>") + "</p>";
  }).join("");

  // 放回代码块
  src = src.replace(/\u0001(\d+)\u0001/g, function (m, i) { return blocks[+i]; });
  return src;
}
