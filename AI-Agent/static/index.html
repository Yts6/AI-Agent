// ============ 核心：发送消息 ============
// ============ 消息队列 ============
// 支持连续发送：忙碌时新消息进队列，可单条立即发送或等待自动处理

let msgQueue = [];          // [{id, text, attachments}]
let queueRunning = false;   // 队列是否正在自动消费
let parallelTasks = 0;      // 并行回答的任务数

function enqueueMessage(text, attachments) {
  msgQueue.push({
    id: "q_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
    text: text,
    attachments: attachments || [],
  });
  renderQueue();
}

function shortText(t, max) {
  const s = (t || "").replace(/\s+/g, " ").trim();
  return s.length > max ? s.slice(0, max) + "…" : s;
}

function renderQueue() {
  const box = document.getElementById("queueBar");
  if (!box) return;

  if (!msgQueue.length) {
    box.style.display = "none";
    box.innerHTML = "";
    return;
  }

  box.style.display = "block";

  const head =
    '<div class="q-head">' +
      '<span class="q-title"><span class="q-dot"></span>待发送 ' +
        msgQueue.length + " 条</span>" +
      '<button class="q-clear" onclick="clearQueue()">全部取消</button>' +
    "</div>";

  const items = msgQueue.map(function (m, i) {
    const attach = m.attachments && m.attachments.length
      ? '<span class="q-attach">📎' + m.attachments.length + "</span>"
      : "";
    return (
      '<div class="q-item" data-qid="' + m.id + '">' +
        '<span class="q-idx">' + (i + 1) + "</span>" +
        '<span class="q-text" title="' + escapeHtml(m.text || "") + '">' +
          escapeHtml(shortText(m.text, 32)) + "</span>" +
        attach +
        '<button class="q-act q-send" data-send="' + m.id + '" title="立即发送">发送</button>' +
        '<button class="q-act q-del" data-qdel="' + m.id + '" title="移除">×</button>' +
      "</div>"
    );
  }).join("");

  box.innerHTML = head + '<div class="q-list">' + items + "</div>";

  // 绑定事件
  box.querySelectorAll("[data-send]").forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      sendFromQueue(btn.dataset.send);
    });
  });
  box.querySelectorAll("[data-qdel]").forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      removeFromQueue(btn.dataset.qdel);
    });
  });
}

// 立即发送某一条（不排队，直接并行跑）
function sendFromQueue(id) {
  const idx = msgQueue.findIndex(function (m) { return m.id === id; });
  if (idx < 0) return;
  const item = msgQueue.splice(idx, 1)[0];
  renderQueue();

  // 不停当前任务，直接开一个新的并行回答
  parallelTasks++;
  sendOne(item.text, item.attachments, true)
    .catch(function () {})
    .finally(function () {
      parallelTasks = Math.max(0, parallelTasks - 1);
      updateSendState();
    });
}

function removeFromQueue(id) {
  msgQueue = msgQueue.filter(function (m) { return m.id !== id; });
  renderQueue();
  updateSendState();
}

function clearQueue() {
  if (!msgQueue.length) return;
  msgQueue = [];
  renderQueue();
  updateSendState();
}

// 依次处理队列（当前空闲时调用）
async function processQueue() {
  if (queueRunning) return;
  if (!msgQueue.length) return;

  queueRunning = true;
  try {
    while (msgQueue.length) {
      const item = msgQueue.shift();
      renderQueue();
      await sendOne(item.text, item.attachments, false);
    }
  } finally {
    queueRunning = false;
    renderQueue();
    updateSendState();
  }
}

async function send() {
  const text = inputEl.value.trim();
  const readyAttach = pendingAttachments.filter(a => !a.loading);
  if (!text && !readyAttach.length) return;

  // 清空输入框
  inputEl.value = "";
  inputEl.style.height = "80px";

  // 有附件时立刻清空附件区（已经复制到 item 里）
  const attachCopy = readyAttach.slice();
  pendingAttachments = [];
  renderAttachments();
  updateSendState();

  // 忙碌中（含并行任务）→ 进队列
  if (busy || queueRunning || parallelTasks > 0) {
    enqueueMessage(text, attachCopy);
    return;
  }

  // 空闲 → 直接发
  await sendOne(text, attachCopy, false);
  if (msgQueue.length) processQueue();
}

// 真正发送一条消息（不检查 busy，由调用方保证串行）
async function sendOne(text, attachList, parallel) {
  const readyAttach = (attachList || []).filter(a => !a.loading && a.text);

  let displayText = text;
  if (readyAttach.length) {
    const names = readyAttach.map(a => a.name).join("、");
    displayText = (text ? text + "\n\n" : "") + "📎 " + names;
  }

  addUserMsg(displayText);
  const contentEl = addAiMsg();
  const bodyEl = contentEl.querySelector(".body");
  const slotEl = contentEl.querySelector(".search-slot");

  // 并行模式下不抢占全局 busy 状态，避免影响主流程
  if (!parallel) setBusy(true);

  let searchPanel = null;
  let kbPanel = null;
  let buffer = "";
  let reasoningText = "";

  let flushTimer = null;
  const flush = () => {
    if (flushTimer) return;
    flushTimer = setTimeout(() => {
      flushTimer = null;
      bodyEl.innerHTML = renderMarkdown(buffer) +
        '<span class="cursor-blink"></span>';
      enhanceCopyButtons(bodyEl);
      scrollBottom();
    }, 40);
  };

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Password": getPassword() },
      body: JSON.stringify({
        message: text,
        session_id: sessionId,
        force_search: forceSearch,
        model_id: currentModel,
        attachments: readyAttach.map(a => ({
          name: a.name, text: a.text, type: a.type, data_url: a.dataUrl || "",
        })),
        search_enabled: searchEnabled,
      }),
    });

    if (resp.status === 401) {
      localStorage.removeItem("agent_pw");
      promptPassword(function () { sendOne(text, attachList); });
      throw new Error("需要访问密码");
    }
    if (!resp.ok) throw new Error("HTTP " + resp.status);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let partial = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      partial += decoder.decode(value, { stream: true });
      const lines = partial.split("\n");
      partial = lines.pop() || "";

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        let evt;
        try { evt = JSON.parse(line.slice(6)); } catch (e) { continue; }

        if (evt.type === "session") {
          // 并行任务不覆盖主会话 id（避免打乱上下文）
          if (!parallel) sessionId = evt.session_id;
        } else if (evt.type === "kb_start") {
          kbPanel = renderKbPanel(slotEl);
        } else if (evt.type === "kb_done") {
          if (kbPanel) updateKbPanel(kbPanel, evt.hits);
        } else if (evt.type === "kb_error") {
          if (kbPanel) kbPanel.innerHTML = '<div class="search-head">⚠️ 知识库检索失败</div>';
        } else if (evt.type === "search_start") {
          searchPanel = renderSearchPanel(slotEl, evt.query, []);
        } else if (evt.type === "search_done") {
          if (searchPanel) updateSearchPanel(searchPanel, evt.results);
        } else if (evt.type === "reasoning") {
          reasoningText += evt.text;
          updateReasoning(slotEl, reasoningText, false);
        } else if (evt.type === "delta") {
          buffer += evt.text;
          flush();
        } else if (evt.type === "done") {
          bodyEl.innerHTML = renderMarkdown(buffer);
          enhanceCopyButtons(bodyEl);
          if (reasoningText) updateReasoning(slotEl, reasoningText, true);
          addMsgCopyButton(contentEl.parentElement, function () { return buffer; });
          scrollBottom();
          loadSessions();
        } else if (evt.type === "error") {
          buffer += "\n\n> ⚠️ " + evt.message;
          bodyEl.innerHTML = renderMarkdown(buffer);
          enhanceCopyButtons(bodyEl);
        }
      }
    }
  } catch (e) {
    bodyEl.innerHTML = renderMarkdown(
      "> ⚠️ 请求失败：" + e.message + "\n\n请检查服务是否在运行。"
    );
  } finally {
    if (searchPanel && !searchPanel.dataset.done) {
      searchPanel.dataset.done = "1";
    }
    bodyEl.innerHTML = renderMarkdown(buffer || "（没有返回内容）");

    if (!parallel) {
      setBusy(false);
      inputEl.focus();
    }
    updateSendState();
  }
}

// ============ 折叠列表 ============

const COLLAPSE_LIMIT = 5;   // 超过这么多条才折叠

function updateCollapseState(wrapId, btnId, itemCount) {
  const wrap = document.getElementById(wrapId);
  const btn = document.getElementById(btnId);
  if (!wrap || !btn) return;

  if (itemCount <= COLLAPSE_LIMIT) {
    wrap.classList.remove("collapsed");
    btn.style.display = "none";
    return;
  }

  // 保留用户的展开/收起选择
  const key = "collapse_" + wrapId;
  const collapsed = localStorage.getItem(key) !== "open";

  wrap.classList.toggle("collapsed", collapsed);
  btn.style.display = "flex";
  btn.querySelector(".txt").textContent = collapsed
    ? "展开全部 " + itemCount + " 项"
    : "收起";
  btn.querySelector(".chev").style.transform = collapsed ? "" : "rotate(180deg)";
}

function toggleKbList() {
  const wrap = document.getElementById("kbWrap");
  if (!wrap) return;
  const isCollapsed = wrap.classList.contains("collapsed");
  wrap.classList.toggle("collapsed", !isCollapsed);
  localStorage.setItem("collapse_kbWrap", isCollapsed ? "open" : "closed");

  const btn = document.getElementById("kbExpand");
  const count = document.querySelectorAll("#kbList .kb-item").length;
  if (btn) {
    btn.querySelector(".txt").textContent = isCollapsed ? "收起" : "展开全部 " + count + " 项";
    btn.querySelector(".chev").style.transform = isCollapsed ? "rotate(180deg)" : "";
  }
}

function toggleSessList() {
  const wrap = document.getElementById("sessWrap");
  if (!wrap) return;
  const isCollapsed = wrap.classList.contains("collapsed");
  wrap.classList.toggle("collapsed", !isCollapsed);
  localStorage.setItem("collapse_sessWrap", isCollapsed ? "open" : "closed");

  const btn = document.getElementById("sessExpand");
  const count = document.querySelectorAll("#sessionList .session-item").length;
  if (btn) {
    btn.querySelector(".txt").textContent = isCollapsed ? "收起" : "展开全部 " + count + " 项";
    btn.querySelector(".chev").style.transform = isCollapsed ? "rotate(180deg)" : "";
  }
}

// ============ 模型设置 ============



let providersCache = [];
let customModelsCache = [];
let editingModelId = null;

async function openSettings() {
  openModal("模型设置", '<div style="text-align:center;padding:40px 0;color:var(--text-dim)"><span class="spinner"></span> 加载中…</div>');
  try {
    const [pRes, cRes] = await Promise.all([
      fetch("/api/models/providers", { headers: { "X-Password": getPassword() } }),
      fetch("/api/models/custom", { headers: { "X-Password": getPassword() } }),
    ]);
    const pData = await pRes.json();
    const cData = await cRes.json();
    providersCache = pData.providers || [];
    customModelsCache = cData.models || [];
    renderSettings("form");
  } catch (e) {
    document.getElementById("modalBody").innerHTML =
      '<div class="test-result err show">加载失败：' + escapeHtml(e.message) + "</div>";
  }
}

function renderSettings(tab) {
  const isForm = tab === "form";
  const isList = tab === "list";

  let html =
    '<div class="settings-tabs">' +
      '<button class="stab' + (isForm ? " active" : "") + '" onclick="renderSettings(\'form\')">添加模型</button>' +
      '<button class="stab' + (isList ? " active" : "") + '" onclick="renderSettings(\'list\')">我的模型 (' + customModelsCache.length + ")</button>" +
    "</div>";

  if (isForm) {
    html += renderAddForm();
  } else {
    html += renderModelList();
  }

  document.getElementById("modalBody").innerHTML = html;

  if (isForm) {
    // 服务商切换自动填 base_url
    const sel = document.getElementById("fProvider");
    if (sel) {
      sel.addEventListener("change", () => {
        const p = providersCache.find(x => x.id === sel.value);
        const urlInput = document.getElementById("fBaseUrl");
        if (p && p.base_url && urlInput) urlInput.value = p.base_url;
      });
    }
  }
}

function renderAddForm() {
  const opts = providersCache.map(p =>
    '<option value="' + p.id + '">' + escapeHtml(p.name) + "</option>"
  ).join("");

  const isEdit = !!editingModelId;

  return (
    '<div class="form-grid">' +
      (isEdit ? '<div class="form-hint" style="color:var(--accent);font-weight:600">正在编辑：' + escapeHtml(editingModelId) + "</div>" : "") +
      '<div class="form-row two">' +
        '<div class="form-row">' +
          '<label class="form-label">模型 ID <span class="req">*</span></label>' +
          '<input class="form-input" id="fId" placeholder="例如 gpt-4o-mini" ' +
            (isEdit ? "disabled" : "") + ">" +
          '<div class="form-hint">唯一标识，调用时用它</div>' +
        "</div>" +
        '<div class="form-row">' +
          '<label class="form-label">显示名称</label>' +
          '<input class="form-input" id="fLabel" placeholder="例如 我的 GPT-4o">' +
          '<div class="form-hint">下拉框里显示的名字</div>' +
        "</div>" +
      "</div>" +
      '<div class="form-row">' +
        '<label class="form-label">服务商</label>' +
        '<select class="form-select" id="fProvider">' + opts + "</select>" +
      "</div>" +
      '<div class="form-row">' +
        '<label class="form-label">接口地址 (base_url) <span class="req">*</span></label>' +
        '<input class="form-input" id="fBaseUrl" placeholder="https://api.openai.com/v1">' +
        '<div class="form-hint">需要 OpenAI 兼容的 /chat/completions 接口</div>' +
      "</div>" +
      '<div class="form-row two">' +
        '<div class="form-row">' +
          '<label class="form-label">API Key <span class="req">*</span></label>' +
          '<input class="form-input" id="fApiKey" type="password" placeholder="sk-...">' +
          '<div class="form-hint">只存在本地 models.json</div>' +
        "</div>" +
        '<div class="form-row">' +
          '<label class="form-label">模型名 <span class="req">*</span></label>' +
          '<input class="form-input" id="fModel" placeholder="gpt-4o-mini">' +
          '<div class="form-hint">API 请求里的 model 参数</div>' +
        "</div>" +
      "</div>" +
      '<div class="form-row">' +
        '<label class="form-label">描述（可选）</label>' +
        '<input class="form-input" id="fDesc" placeholder="一句话说明这个模型的特点">' +
      "</div>" +
      '<div class="form-row">' +
        '<label class="form-label">能力标记</label>' +
        '<div class="check-row">' +
          '<label class="check-item"><input type="checkbox" id="fVision"> 支持图片识别</label>' +
          '<label class="check-item"><input type="checkbox" id="fReasoning"> 带思考过程</label>' +
        "</div>" +
      "</div>" +
      '<div id="testResult" class="test-result"></div>' +
      '<div class="btn-row">' +
        '<button class="btn btn-ghost" id="btnTest" onclick="testModelConfig()">测试连接</button>' +
        '<button class="btn btn-primary" id="btnSave" onclick="saveModel()">' + (isEdit ? "保存修改" : "添加模型") + "</button>" +
        (isEdit ? '<button class="btn btn-ghost" onclick="cancelEdit()">取消</button>' : "") +
      "</div>" +
    "</div>"
  );
}

function renderModelList() {
  if (!customModelsCache.length) {
    return (
      '<div class="empty-hint">' +
        '<div class="big">＋</div>' +
        "还没有添加自定义模型<br>" +
        '<span style="font-size:12px">切换到「添加模型」试试</span>' +
      "</div>"
    );
  }

  return (
    '<div class="model-list">' +
      customModelsCache.map(m => {
        const tags = [];
        if (m.vision) tags.push('<span class="mc-tag vision">视觉</span>');
        if (m.reasoning) tags.push('<span class="mc-tag reason">推理</span>');
        if (m.tag) tags.push('<span class="mc-tag">' + escapeHtml(m.tag) + "</span>");

        return (
          '<div class="model-card">' +
            '<div class="mc-head">' +
              '<span class="mc-id">' + escapeHtml(m.id) + "</span>" +
              tags.join("") +
              '<div class="mc-actions">' +
                '<button class="mc-btn" onclick="editModel(\'' + m.id + '\')">编辑</button>' +
                '<button class="mc-btn del" onclick="deleteModel(\'' + m.id + '\')">删除</button>' +
              "</div>" +
            "</div>" +
            (m.desc ? '<div class="mc-desc">' + escapeHtml(m.desc) + "</div>" : "") +
            '<div class="mc-meta">' +
              "<span>接口 <code>" + escapeHtml(m.base_url || "-") + "</code></span>" +
              "<span>模型 <code>" + escapeHtml(m.model || "-") + "</code></span>" +
              "<span>Key <code>" + escapeHtml(m.api_key || "-") + "</code></span>" +
            "</div>" +
          "</div>"
        );
      }).join("") +
    "</div>"
  );
}

function collectForm() {
  return {
    id: (document.getElementById("fId") || {}).value || "",
    label: (document.getElementById("fLabel") || {}).value || "",
    provider: (document.getElementById("fProvider") || {}).value || "custom",
    base_url: (document.getElementById("fBaseUrl") || {}).value || "",
    api_key: (document.getElementById("fApiKey") || {}).value || "",
    model: (document.getElementById("fModel") || {}).value || "",
    desc: (document.getElementById("fDesc") || {}).value || "",
    vision: (document.getElementById("fVision") || {}).checked || false,
    reasoning: (document.getElementById("fReasoning") || {}).checked || false,
  };
}

function showTestResult(ok, text) {
  const el = document.getElementById("testResult");
  if (!el) return;
  el.className = "test-result show " + (ok ? "ok" : "err");
  el.innerHTML = (ok ? "✓ " : "✗ ") + escapeHtml(text);
}

async function testModelConfig() {
  const f = collectForm();
  const btn = document.getElementById("btnTest");
  btn.disabled = true;
  btn.textContent = "测试中…";
  try {
    const r = await fetch("/api/models/test", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Password": getPassword() },
      body: JSON.stringify({
        base_url: f.base_url,
        api_key: f.api_key,
        model: f.model || f.id,
      }),
    });
    const d = await r.json();
    showTestResult(d.ok, d.message + (d.latency ? "  (" + d.latency + "s)" : ""));
  } catch (e) {
    showTestResult(false, e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "测试连接";
  }
}

async function saveModel() {
  const f = collectForm();
  const btn = document.getElementById("btnSave");

  if (!f.id || !f.base_url || !f.model) {
    showTestResult(false, "模型 ID、接口地址、模型名是必填的");
    return;
  }
  if (!editingModelId && !f.api_key) {
    showTestResult(false, "API Key 不能为空");
    return;
  }

  btn.disabled = true;
  btn.textContent = "保存中…";
  try {
    const url = editingModelId
      ? "/api/models/custom/" + encodeURIComponent(editingModelId)
      : "/api/models/custom";
    const method = editingModelId ? "PATCH" : "POST";
    const r = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json", "X-Password": getPassword() },
      body: JSON.stringify(f),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "保存失败");

    // 刷新
    const cRes = await fetch("/api/models/custom", { headers: { "X-Password": getPassword() } });
    const cData = await cRes.json();
    customModelsCache = cData.models || [];

    await loadModels();  // 刷新下拉框

    editingModelId = null;
    renderSettings("list");
  } catch (e) {
    showTestResult(false, e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = editingModelId ? "保存修改" : "添加模型";
  }
}

async function editModel(id) {
  try {
    const r = await fetch("/api/models/detail?model_id=" + encodeURIComponent(id), {
      headers: { "X-Password": getPassword() },
    });
    const m = await r.json();
    if (!r.ok) throw new Error(m.detail || "加载失败");

    editingModelId = id;
    renderSettings("form");

    document.getElementById("fId").value = m.id || "";
    document.getElementById("fLabel").value = m.label || "";
    document.getElementById("fBaseUrl").value = m.base_url || "";
    document.getElementById("fModel").value = m.model || "";
    document.getElementById("fDesc").value = m.desc || "";
    document.getElementById("fVision").checked = !!m.vision;
    document.getElementById("fReasoning").checked = !!m.reasoning;
    document.getElementById("fApiKey").placeholder = m.has_key ? "留空则不修改" : "sk-...";

    const sel = document.getElementById("fProvider");
    if (sel && m.provider) sel.value = m.provider;
  } catch (e) {
    alert("加载失败：" + e.message);
  }
}

function cancelEdit() {
  editingModelId = null;
  renderSettings("list");
}

async function deleteModel(id) {
  if (!confirm("确定删除模型 " + id + " 吗？")) return;
  try {
    const r = await fetch("/api/models/custom/" + encodeURIComponent(id), {
      method: "DELETE",
      headers: { "X-Password": getPassword() },
    });
    if (!r.ok) {
      const d = await r.json();
      throw new Error(d.detail || "删除失败");
    }
    const cRes = await fetch("/api/models/custom", { headers: { "X-Password": getPassword() } });
    const cData = await cRes.json();
    customModelsCache = cData.models || [];
    await loadModels();
    renderSettings("list");
  } catch (e) {
    alert("删除失败：" + e.message);
  }
}

// ============ 评估 ============

function metricCard(label, value, cls) {
  return '<div class="metric"><div class="metric-label">' + label +
    '</div><div class="metric-value ' + (cls || "") + '">' + value + "</div></div>";
}

async function openEval() {
  openModal("RAG 评估", '<div style="text-align:center;padding:30px 0;color:var(--text-dim)">' +
    '<span class="spinner"></span> 正在评估（含重排，约需 30-60 秒）…</div>');
  try {
    const r = await fetch("/api/eval/run", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Password": getPassword() },
      body: JSON.stringify({ rewrite: true, rerank: true, with_answer: false })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "评估失败");
    renderEval(d);
  } catch (e) {
    document.getElementById("modalBody").innerHTML =
      '<div style="color:#dc2626">评估失败：' + escapeHtml(e.message) + "</div>";
  }
}

function renderEval(d) {
  const cls = v => (v >= 0.9 ? "good" : v >= 0.7 ? "" : "warn");
  let html = '<div class="metric-grid">';
  html += metricCard("Recall@4", (d.recall_at_k * 100).toFixed(1) + "%", cls(d.recall_at_k));
  html += metricCard("MRR", d.mrr.toFixed(3), cls(d.mrr));
  html += metricCard("用例数", d.total);
  html += metricCard("平均耗时", d.avg_elapsed.toFixed(2) + "s");
  html += "</div>";

  html += '<div class="debug-section-title">逐条结果</div>';
  (d.results || []).forEach((x, i) => {
    html += '<div class="eval-row">' +
      '<span class="eval-mark ' + (x.recall_hit ? "ok" : "no") + '">' +
      (x.recall_hit ? "✓" : "✗") + "</span>" +
      '<span class="eval-q">' + (i + 1) + ". " + escapeHtml(x.question) + "</span>" +
      '<span class="eval-score">MRR ' + x.mrr.toFixed(2) + "</span></div>";
  });

  html += '<div style="margin-top:16px;font-size:12px;color:var(--text-dim);line-height:1.7">' +
    "Recall@4：正确片段进入前 4 名的比例<br>" +
    "MRR：正确片段排名的倒数均值，越接近 1 越好" +
    "</div>";

  document.getElementById("modalBody").innerHTML = html;
}

// ============ 检索调试 ============

function openDebug() {
  const html =
    '<div class="debug-input">' +
    '<input id="dbgQuery" placeholder="输入问题，查看检索全过程" ' +
    'onkeydown="if(event.key===\'Enter\')runDebug()">' +
    '<button onclick="runDebug()">分析</button></div>' +
    '<div id="dbgResult" style="color:var(--text-dim);font-size:13px">' +
    "输入问题后点分析，可以看到查询改写、粗排候选、重排打分每一步的结果。</div>";
  openModal("检索过程调试", html);
  setTimeout(() => { const el = document.getElementById("dbgQuery"); if (el) el.focus(); }, 100);
}

async function runDebug() {
  const q = document.getElementById("dbgQuery").value.trim();
  if (!q) return;
  const box = document.getElementById("dbgResult");
  box.innerHTML = '<span class="spinner"></span> 分析中…';
  try {
    const r = await fetch("/api/kb/debug", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Password": getPassword() },
      body: JSON.stringify({ query: q, top_k: 4 })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "失败");

    let html = '<div class="debug-section-title">1. 查询改写</div>';
    (d.rewritten || []).forEach(x => {
      html += '<span class="debug-chip">' + escapeHtml(x) + "</span>";
    });

    html += '<div class="debug-section-title">2. 粗排召回（' + d.recall_k + " 条，按重排分排序）</div>";
    (d.candidates || []).forEach(c => {
      html += '<div class="debug-cand"><span class="scores">' +
        '粗 ' + c.score.toFixed(3) + " / 精 " + c.rerank.toFixed(3) + '</span><span class="txt">' +
        escapeHtml(c.doc) + " · " + escapeHtml(c.preview) + "</span></div>";
    });

    html += '<div class="debug-section-title">3. 最终返回</div>';
    (d.final || []).forEach((c, i) => {
      html += '<div class="debug-cand"><span class="scores">[' + (i + 1) + '] ' +
        c.score.toFixed(3) + '</span><span class="txt">' +
        escapeHtml(c.text.slice(0, 100)) + "</span></div>";
    });

    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = '<span style="color:#dc2626">失败：' + escapeHtml(e.message) + "</span>";
  }
}
