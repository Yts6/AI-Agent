[project]
name = "agent-learning"
version = "0.1.0"
description = "AI Agent / 大模型应用开发学习项目"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-community>=0.4",
    "langgraph>=1.0",
    "streamlit>=1.30",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "chromadb>=0.5",
    "sentence-transformers>=2.6",
]

[tool.black]
line-length = 100
target-version = ['py311']
